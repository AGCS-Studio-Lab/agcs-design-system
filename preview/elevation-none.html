<!doctype html>
<!-- @dsCard group="Brand" name="Elevation — None" subtitle="Zero radius, zero shadow" viewport="700x220" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
  <div class="mono-12" style="margin-bottom:14px;">RADII · SHADOWS · BORDERS -- by design, nearly all zero.</div>
  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;">
    <div style="background:#FFF;border:1px solid #E5E5E5;height:88px;display:flex;align-items:center;justify-content:center;">
      <div class="mono-13">radius: 0</div>
    </div>
    <div style="background:#FFF;border:1px solid #E5E5E5;height:88px;display:flex;align-items:center;justify-content:center;">
      <div class="mono-13">shadow: none</div>
    </div>
    <div style="background:#FFF;border:1px solid #E5E5E5;height:88px;display:flex;align-items:center;justify-content:center;">
      <div class="mono-13">border: 1px Mist</div>
    </div>
  </div>
  <hr class="rule">
  <div class="mono-13" style="line-height:1.8;">
    <div>✕ rounded corners · ✕ drop shadows · ✕ inner shadows · ✕ glows</div>
    <div>✕ colored borders · ✕ thick borders (>1px) · ✕ glass / blur</div>
    <div>✓ 1px Mist hairlines · ✓ whitespace + ground inversion for hierarchy</div>
  </div>
</body></html>

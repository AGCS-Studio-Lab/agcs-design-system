<!doctype html>
<!-- @dsCard group="Brand" name="Colors — Lime usage" subtitle="Lime accent · max one element per slide" viewport="700x300" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
  <div class="mono-12" style="margin-bottom:14px;">LIME -- one element per slide. Never decoration. Never background.</div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
    <div style="background:#000;padding:18px 16px;color:#fff;height:120px;display:flex;flex-direction:column;justify-content:space-between;">
      <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;">✓ ALLOWED</div>
      <div style="display:flex;justify-content:space-between;align-items:flex-end;">
        <div style="font-family:'N27',system-ui,sans-serif;font-weight:700;font-size:28px;line-height:1;">69<span style="color:#BEFF3A;">%</span></div>
        <div style="font-family:'IBM Plex Mono',monospace;font-size:10px;opacity:.6;">one callout</div>
      </div>
    </div>
    <div style="background:#000;padding:18px 16px;color:#fff;height:120px;display:flex;flex-direction:column;justify-content:space-between;position:relative;">
      <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;color:#BEFF3A;">✕ FORBIDDEN</div>
      <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;line-height:1.4;color:#BEFF3A;">No lime body text.<br>No lime backgrounds.<br>No two lime elements.</div>
    </div>
  </div>
  <div class="mono-12" style="margin-top:14px;opacity:.6;">Permitted slots: brand icon · ONE chart bar · ONE numerical callout.</div>
</body></html>

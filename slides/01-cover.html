<!doctype html>
<!-- @dsCard group="Slides" name="Slide 01 — Cover" subtitle="Obsidian, flat (no grid) · lime chip · N27 title · Crimson SemiBold Italic deck line · icon aligned to the title block · a lab deck always takes the lab icon (flask)" viewport="1280x720" -->
<html lang="es">
<head>
<meta charset="utf-8">
<title>AGCS · Cover</title>
<link rel="stylesheet" href="_slide.css">
</head>
<body>
<!-- FLAT. The cover is a silence slide: Obsidian, title, subtitle, icon. No
     grid (Max, 2026-09-02). See slides/_slide.css for the list. -->
<div class="agcs-canvas agcs-on-dark" data-screen-label="01 Cover">

  <!-- Top mono band -->
  <div class="top-row">
    <div><span class="chev">&gt;&gt;</span>&nbsp; CUSTOMER JOURNEY WORKSHOP</div>
    <div><span class="chev">&gt;&gt;</span>&nbsp; LAB · CxbD</div>
  </div>

  <!-- Lockup stack: the ROW holds chip > title > SUBTITLE and the topic
       icon, and aligns the icon's center to that block's center (v5.4,
       Max 2026-09-22). The mono metadata flows below, outside the row, so
       it never moves the icon. See .lockup-row in _slide.css. -->
  <div class="lockup-stack" style="top:540px;">

    <div class="lockup-row">
      <div class="lockup">
        <div class="chip-lime">Results</div>

        <div style="font-family:'N27',system-ui,sans-serif; font-weight:700;
                    font-size:280px; line-height:0.98; letter-spacing:-0.015em;
                    margin-top:56px; color:#fff;">
          Customer<br>Journey Lab.
        </div>

        <!-- The subtitle. Crimson Pro SEMIBOLD ITALIC, always -- not Regular,
             not Plex Sans. It states the deck's conclusion in one line. -->
        <div class="deck-line" style="margin-top:64px; color:#fff;">
          Cómo lo vive el cliente hoy &mdash; y cómo lo va a vivir.
        </div>
      </div>

      <!-- TOPIC ICON -- the cover carries a topic icon, NOT the logo, in
           verde1 because the Obsidian ground has no other lime on it.

           THIS IS A LAB DECK, so the icon is the LAB ICON: the flask,
           `alxgdo/01`, copied to assets/agcs_lab_icon_lime.png. A lab deck
           always opens with it -- it is the one cover icon that does not
           rotate (Max, 2026-09-22). Any other deck picks its cover icon from
           assets/icons/INDEX.md by subject: a culture deck the spiral
           (`alxgdo/22`), a foresight deck the telescope (`alxgdo/18`), a
           decision deck the fork (`alxgdo/17`). -->
      <img class="topic-icon is-hero" src="../assets/agcs_lab_icon_lime.png" alt="">
    </div>

    <div style="font-family:'IBM Plex Mono',monospace; font-size:36px;
                letter-spacing:0.06em; text-transform:uppercase;
                margin-top:96px; color:#fff;">
      4 grupos · 4 arquetipos · AS-IS &rarr; TO-BE validado
    </div>

    <div style="font-family:'IBM Plex Mono',monospace; font-size:32px;
                letter-spacing:0.06em; text-transform:uppercase;
                margin-top:120px; color:#9A9A9A;">
      Cliente &middot; Programa &middot; Mes A&ntilde;o
    </div>

  </div>

  <!-- Bottom attribution -->
  <div class="bottom-row">
    <div>AGCS&nbsp;|&nbsp;Studio&nbsp;+&nbsp;Lab&nbsp;|</div>
    <div><span class="chev">&gt;&gt;</span>&nbsp; STAY FORWARD</div>
  </div>

</div>
<script src="_fit.js"></script>
</body>
</html>

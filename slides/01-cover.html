<!doctype html>
<!-- @dsCard group="Slides" name="Slide 01 — Cover" subtitle="Obsidian, flat (no grid) · lime chip · N27 title · Crimson SemiBold Italic deck line · topic icon chosen per deck, never this one by default" viewport="1280x720" -->
<html lang="es">
<head>
<meta charset="utf-8">
<title>AGCS · Cover</title>
<link rel="stylesheet" href="_slide.css">
</head>
<body>
<!-- FLAT. The cover is a silence slide: Obsidian, title, subtitle, icon. No
     grid (Max, 2026-09-02). See slides/_slide.css for the list. -->
<div class="agcs-canvas agcs-on-dark" data-screen-label="01 Cover">

  <!-- Top mono band -->
  <div class="top-row">
    <div><span class="chev">&gt;&gt;</span>&nbsp; CUSTOMER JOURNEY WORKSHOP</div>
    <div><span class="chev">&gt;&gt;</span>&nbsp; LAB · CxbD</div>
  </div>

  <!-- Left stack: chip > title > SUBTITLE (Crimson Pro SemiBold Italic) > mono metadata -->
  <div style="position:absolute; left:160px; top:540px; right:1600px;">

    <div class="chip-lime">Results</div>

    <div style="font-family:'N27',system-ui,sans-serif; font-weight:700;
                font-size:280px; line-height:0.98; letter-spacing:-0.015em;
                margin-top:56px; color:#fff;">
      Customer<br>Journey.
    </div>

    <!-- The subtitle. Crimson Pro SEMIBOLD ITALIC, always -- not Regular, not
         Plex Sans. It states the deck's conclusion in one line. -->
    <div class="deck-line" style="margin-top:64px; color:#fff;">
      Cómo lo vive el cliente hoy &mdash; y cómo lo va a vivir.
    </div>

    <div style="font-family:'IBM Plex Mono',monospace; font-size:36px;
                letter-spacing:0.06em; text-transform:uppercase;
                margin-top:96px; color:#fff;">
      4 grupos · 4 arquetipos · AS-IS &rarr; TO-BE validado
    </div>

    <div style="font-family:'IBM Plex Mono',monospace; font-size:32px;
                letter-spacing:0.06em; text-transform:uppercase;
                margin-top:120px; color:#9A9A9A;">
      Cliente &middot; Programa &middot; Mes A&ntilde;o
    </div>

  </div>

  <!-- TOPIC ICON -- the cover carries a topic icon, NOT the logo. It is the
       oversized `is-hero` treatment, in verde1 because the Obsidian ground
       has no other lime on it.

       CHOOSE IT PER DECK. This one is `icons-grid/14` because the example
       deck is a Customer Journey. A culture deck takes `alxgdo/22` (spiral),
       a foresight deck `alxgdo/18` (telescope), a lab program `alxgdo/01`
       (flask), a decision deck `alxgdo/17` (fork). The full list with
       meanings is assets/icons/INDEX.md.

       ON PURPOSE: every template in this system pulls its example icon from
       a DIFFERENT set (cover from `icons-grid/`, divider from `alxgdo/`).
       There is no icon that can be copied out of the templates and passed
       off as "the AGCS icon" -- if two decks in a row share a cover icon,
       or an icon repeats inside one deck, that is a defect. -->
  <img class="topic-icon is-hero" src="../assets/icons/icons-grid/color-01/14.png" alt=""
       style="--icon-size:1700px; right:120px;">

  <!-- Bottom attribution -->
  <div class="bottom-row">
    <div>AGCS&nbsp;|&nbsp;Studio&nbsp;+&nbsp;Lab&nbsp;|</div>
    <div><span class="chev">&gt;&gt;</span>&nbsp; STAY FORWARD</div>
  </div>

</div>
<script src="_fit.js"></script>
</body>
</html>

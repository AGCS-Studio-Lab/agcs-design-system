<!doctype html>
<!-- @dsCard group="Slides" name="Slide 07 — System (Lab)" subtitle="Lab register · has-grid (it is a diagram) · >> LAB stamp — the register itself adds no grid" viewport="1280x720" -->
<html lang="es">
<head>
<meta charset="utf-8">
<title>AGCS · System (Lab)</title>
<link rel="stylesheet" href="_slide.css">
</head>
<body>
<!-- REGISTER: the canonical Lab slide. `reg-lab` gives it the stamp slot and
     the construction grid full-bleed. System is also one of the four
     construction layouts, so a Studio System slide takes `has-grid` and
     looks the same minus the stamp. -->
<div class="agcs-canvas reg-lab has-grid" data-screen-label="07 System Lab">

  <div class="top-row">
    <div>SYSTEM · ARGUS</div>
    <div><span class="chev">&gt;&gt;</span>&nbsp; LAB · V03</div>
  </div>

  <!-- Slim header -->
  <div style="position:absolute; left:144px; right:144px; top:260px;
              font-family:'N27',system-ui,sans-serif; font-weight:500;
              font-size:72px; line-height:1.1; color:#000;">
    Workflow architecture &mdash; assessment to synthesis.
  </div>

  <!-- Diagram. Nodes carry a solid Paper fill so they sit on top of the
       grid instead of dissolving into it. Geometry in whole 48px cells
       (v5.6): the SVG is drawn 1:1 from x=144 (3 cells), y=960 (20 cells);
       nodes 672 x 288 (14 x 6 cells) on a 288 gap (6 cells), so every edge
       and every connector sits on a grid line. -->
  <div style="position:absolute; left:144px; top:960px; width:3552px; height:480px;">

    <svg viewBox="0 0 3552 480" width="3552" height="480" style="display:block;">
      <!-- 4 nodes in a horizontal flow -->
      <g font-family="'IBM Plex Mono', monospace" font-size="36"
         text-anchor="middle" fill="#1A1A1A">

        <!-- Node 1 -->
        <rect x="0"    y="48" width="672" height="288" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"/>
        <text x="336"  y="176" font-size="32" letter-spacing="3" font-weight="500">01 · INTAKE</text>
        <text x="336"  y="256" font-size="28" fill="#1A1A1A">Executive responses</text>

        <!-- Node 2 -->
        <rect x="960"  y="48" width="672" height="288" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"/>
        <text x="1296" y="176" font-size="32" letter-spacing="3" font-weight="500">02 · PATTERN</text>
        <text x="1296" y="256" font-size="28" fill="#1A1A1A">Signal extraction</text>

        <!-- Node 3 -->
        <rect x="1920" y="48" width="672" height="288" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"/>
        <text x="2256" y="176" font-size="32" letter-spacing="3" font-weight="500">03 · TENSIONS</text>
        <text x="2256" y="256" font-size="28" fill="#1A1A1A">Trade-offs surfaced</text>

        <!-- Node 4 (LIME -- the one accent) -->
        <rect x="2880" y="48" width="672" height="288" fill="var(--lime)" stroke="#000" stroke-width="2"/>
        <text x="3216" y="176" font-size="32" letter-spacing="3" font-weight="500" fill="#000">04 · SYNTHESIS</text>
        <text x="3216" y="256" font-size="28" fill="#000">Conclusion-first deck</text>

        <!-- Connectors, on the grid line through the nodes' middle (y=1152, 24 cells) -->
        <line x1="672"  y1="192" x2="960"  y2="192" stroke="#1A1A1A" stroke-width="2"/>
        <line x1="1632" y1="192" x2="1920" y2="192" stroke="#1A1A1A" stroke-width="2"/>
        <line x1="2592" y1="192" x2="2880" y2="192" stroke="#1A1A1A" stroke-width="2"/>

        <!-- Chevron marks above each connector -->
        <text x="816"  y="164" font-size="40" letter-spacing="-4">&gt;&gt;</text>
        <text x="1776" y="164" font-size="40" letter-spacing="-4">&gt;&gt;</text>
        <text x="2736" y="164" font-size="40" letter-spacing="-4">&gt;&gt;</text>
      </g>
    </svg>
  </div>

  <div class="bottom-row">
    <div>AGCS&nbsp;|&nbsp;Studio&nbsp;+&nbsp;Lab&nbsp;|</div>
    <div>SYS · 03</div>
  </div>

</div>
<script src="_fit.js"></script>
</body>
</html>

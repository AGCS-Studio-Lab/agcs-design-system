<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>AGCS · Sample Deck</title>
<style>
  html, body { margin: 0; padding: 0; background: #1a1a1a; height: 100%; }
  deck-stage { display: block; height: 100vh; }
  section { width: 3840px; height: 2160px; position: relative; background: #000; overflow: hidden; }
  section > iframe {
    position: absolute; inset: 0;
    width: 3840px; height: 2160px;
    border: 0; display: block;
    pointer-events: none;
  }
</style>
</head>
<body>
<deck-stage width="3840" height="2160">
  <section data-screen-label="01 Cover"><iframe src="01-cover.html"></iframe></section>
  <section data-screen-label="02 Section Divider"><iframe src="02-section-divider.html"></iframe></section>
  <section data-screen-label="03 Content"><iframe src="03-content.html"></iframe></section>
  <section data-screen-label="04 Insight"><iframe src="04-insight.html"></iframe></section>
  <section data-screen-label="05 Quote"><iframe src="05-quote.html"></iframe></section>
  <section data-screen-label="06 End"><iframe src="06-end.html"></iframe></section>
  <section data-screen-label="07 System (Lab)"><iframe src="07-system-lab.html"></iframe></section>
</deck-stage>

<script src="deck-stage.js"></script>
</body>
</html>
